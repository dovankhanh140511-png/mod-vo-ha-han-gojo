name: Build Gojo vs Sukuna Mod

on:
  push:
    branches: [ main, master ]
  workflow_dispatch:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v5

      - name: Set up JDK 17
        uses: actions/setup-java@v5
        with:
          distribution: 'temurin'
          java-version: '17'

      - name: Download Fabric Template
        run: |
          git clone https://github.com/FabricMC/fabric-example-mod.git /tmp/mod
          cp -r /tmp/mod/* .
          cp -r /tmp/mod/gradlew* .
          rm -rf /tmp/mod

      - name: Clean Template
        run: |
          rm -rf src/main/java/com/example/ExampleMod.java
          rm -rf src/main/java/com/example/ExampleModClient.java
          mkdir -p src/main/resources/assets/animeoverlord/lang

      - name: Inject Gojo & Sukuna Code
        run: |
          # 1. Cấu hình fabric.mod.json
          cat << 'EOF' > src/main/resources/fabric.mod.json
          {
            "schemaVersion": 1,
            "id": "animeoverlord",
            "version": "1.1.0",
            "name": "Gojo & Sukuna Overlord",
            "description": "Infinity and Malevolent Shrine",
            "authors": ["You"],
            "contact": {},
            "license": "MIT",
            "icon": "assets/animeoverlord/icon.png",
            "environment": "*",
            "entrypoints": {
              "main": ["com.example.AnimeOverlord"],
              "client": ["com.example.AnimeOverlordClient"]
            },
            "depends": {
              "fabricloader": ">=0.14.21",
              "fabric-api": "*",
              "minecraft": "~1.20.1",
              "java": ">=17"
            }
          }
          EOF

          # 2. Ngôn ngữ (Việt hóa 100%)
          cat << 'EOF' > src/main/resources/assets/animeoverlord/lang/en_us.json
          {
            "key.animeoverlord.infinity": "Toggle Infinity",
            "key.animeoverlord.domain": "Cast Domain",
            "category.animeoverlord.keys": "Gojo & Sukuna"
          }
          EOF
          
          cat << 'EOF' > src/main/resources/assets/animeoverlord/lang/vi_vn.json
          {
            "key.animeoverlord.infinity": "Bật/Tắt Vô Hạ Hạn",
            "key.animeoverlord.domain": "Khai Triển Ác Mộc Cứu Ảnh",
            "category.animeoverlord.keys": "Gojo & Sukuna"
          }
          EOF

          # 3. Class xử lý Vô Hạ Hạn
          cat << 'EOF' > src/main/java/com/example/InfinityHandler.java
          package com.example;

          import net.fabricmc.fabric.api.entity.event.v1.ServerLivingEntityEvents;
          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.minecraft.entity.Entity;
          import net.minecraft.entity.projectile.ProjectileEntity;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.util.math.Box;
          import java.util.*;

          public class InfinityHandler {
              public static final Set<UUID> ACTIVE_PLAYERS = new HashSet<>();
              public static final Map<UUID, Double> RADIUS_MAP = new HashMap<>();

              public static void init() {
                  ServerLivingEntityEvents.ALLOW_DAMAGE.register((entity, source, amount) -> {
                      if (entity instanceof ServerPlayerEntity player) {
                          if (ACTIVE_PLAYERS.contains(player.getUuid())) return false;
                      }
                      return true;
                  });

                  ServerTickEvents.END_SERVER_TICK.register(server -> {
                      for (UUID uuid : ACTIVE_PLAYERS) {
                          ServerPlayerEntity player = server.getPlayerManager().getPlayer(uuid);
                          if (player != null) {
                              double radius = RADIUS_MAP.getOrDefault(uuid, 5.0);
                              Box area = player.getBoundingBox().expand(radius);
                              List<Entity> entities = player.getWorld().getOtherEntities(player, area);
                              for (Entity e : entities) {
                                  if (e instanceof ProjectileEntity) {
                                      e.setVelocity(0, 0, 0);
                                      e.setPosition(e.getX(), e.getY(), e.getZ());
                                  }
                              }
                          }
                      }
                  });
              }
          }
          EOF

          # 4. Class xử lý Domain Sukuna (Ác Mộc Cứu Ảnh)
          cat << 'EOF' > src/main/java/com/example/DomainHandler.java
          package com.example;

          import net.fabricmc.fabric.api.event.lifecycle.v1.ServerTickEvents;
          import net.minecraft.entity.LivingEntity;
          import net.minecraft.particle.ParticleTypes;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.server.world.ServerWorld;
          import net.minecraft.text.Text;
          import net.minecraft.util.math.Box;
          import java.util.*;

          public class DomainHandler {
              public static final Map<UUID, Integer> ACTIVE_DOMAINS = new HashMap<>();
              public static final Map<UUID, Integer> COOLDOWNS = new HashMap<>();

              public static void init() {
                  ServerTickEvents.END_SERVER_TICK.register(server -> {
                      // Kích hoạt Ác Mộc Cứu Ảnh
                      Iterator<Map.Entry<UUID, Integer>> iterator = ACTIVE_DOMAINS.entrySet().iterator();
                      while (iterator.hasNext()) {
                          Map.Entry<UUID, Integer> entry = iterator.next();
                          ServerPlayerEntity player = server.getPlayerManager().getPlayer(entry.getKey());
                          int ticksLeft = entry.getValue();

                          if (player == null || player.isDead()) {
                              iterator.remove();
                              continue;
                          }

                          ServerWorld world = (ServerWorld) player.getWorld();
                          double radius = 15.0;
                          Box area = player.getBoundingBox().expand(radius);

                          // Sát thương mỗi 0.5s (10 ticks)
                          if (ticksLeft % 10 == 0) {
                              List<LivingEntity> entities = world.getEntitiesByClass(LivingEntity.class, area, e -> e != player);
                              for (LivingEntity e : entities) {
                                  if (e instanceof ServerPlayerEntity target && InfinityHandler.ACTIVE_PLAYERS.contains(target.getUuid())) continue;
                                  e.damage(world.getDamageSources().magic(), 5.0f);
                                  world.spawnParticles(ParticleTypes.DAMAGE_INDICATOR, e.getX(), e.getY() + 1.0, e.getZ(), 5, 0.5, 0.5, 0.5, 0.1);
                              }
                          }

                          // Hiệu ứng hạt
                          if (ticksLeft % 2 == 0) {
                              for (int i = 0; i < 5; i++) {
                                  double ox = (world.random.nextDouble() - 0.5) * radius * 2;
                                  double oz = (world.random.nextDouble() - 0.5) * radius * 2;
                                  world.spawnParticles(ParticleTypes.SOUL_FIRE_FLAME, player.getX() + ox, player.getY() + 0.5, player.getZ() + oz, 2, 0, 0.5, 0, 0.05);
                              }
                          }

                          ticksLeft--;
                          if (ticksLeft <= 0) {
                              iterator.remove();
                              player.sendMessage(Text.literal("§c[Ác Mộc Cứu Ảnh] §fĐã kết thúc!"), false);
                              COOLDOWNS.put(player.getUuid(), 400); // 20s cooldown
                          } else {
                              entry.setValue(ticksLeft);
                          }
                      }

                      // Giảm hồi chiêu
                      Iterator<Map.Entry<UUID, Integer>> cdIterator = COOLDOWNS.entrySet().iterator();
                      while (cdIterator.hasNext()) {
                          Map.Entry<UUID, Integer> entry = cdIterator.next();
                          int ticks = entry.getValue() - 1;
                          if (ticks <= 0) {
                              cdIterator.remove();
                              ServerPlayerEntity player = server.getPlayerManager().getPlayer(entry.getKey());
                              if (player != null) player.sendMessage(Text.literal("§a[Ác Mộc Cứu Ảnh] §fĐã sẵn sàng!"), false);
                          } else {
                              entry.setValue(ticks);
                          }
                      }
                  });
              }

              public static void castDomain(ServerPlayerEntity player) {
                  UUID uuid = player.getUuid();
                  if (ACTIVE_DOMAINS.containsKey(uuid)) {
                      player.sendMessage(Text.literal("§c[Ác Mộc Cứu Ảnh] §fĐang thi triển!"), false);
                      return;
                  }
                  if (COOLDOWNS.containsKey(uuid)) {
                      player.sendMessage(Text.literal("§c[Ác Mộc Cứu Ảnh] §fHồi chiêu: " + (COOLDOWNS.get(uuid) / 20) + "s"), false);
                      return;
                  }
                  ACTIVE_DOMAINS.put(uuid, 300); // 15s = 300 ticks
                  player.sendMessage(Text.literal("§4[Ác Mộc Cứu Ảnh] §fKhai triển!"), false);
              }
          }
          EOF

          # 5. Class chính (Đăng ký lệnh)
          cat << 'EOF' > src/main/java/com/example/AnimeOverlord.java
          package com.example;

          import net.fabricmc.api.ModInitializer;
          import net.fabricmc.fabric.api.command.v2.CommandRegistrationCallback;
          import net.minecraft.server.command.CommandManager;
          import net.minecraft.server.network.ServerPlayerEntity;
          import net.minecraft.text.Text;
          import java.util.UUID;

          public class AnimeOverlord implements ModInitializer {
              @Override
              public void onInitialize() {
                  InfinityHandler.init();
                  DomainHandler.init();

                  CommandRegistrationCallback.EVENT.register((dispatcher, registryAccess, environment) -> {
                      // Lệnh Vô Hạ Hạn
                      dispatcher.register(CommandManager.literal("infinity")
                          .then(CommandManager.literal("toggle").executes(context -> {
                              ServerPlayerEntity player = context.getSource().getPlayer();
                              if (player != null) {
                                  UUID uuid = player.getUuid();
                                  if (InfinityHandler.ACTIVE_PLAYERS.contains(uuid)) {
                                      InfinityHandler.ACTIVE_PLAYERS.remove(uuid);
                                      player.sendMessage(Text.literal("§b[Vô Hạ Hạn] §cĐã TẮT"), false);
                                  } else {
                                      InfinityHandler.ACTIVE_PLAYERS.add(uuid);
                                      player.sendMessage(Text.literal("§b[Vô Hạ Hạn] §aĐã BẬT (Bất tử)"), false);
                                  }
                              }
                              return 1;
                          }))
                          .then(CommandManager.literal("radius")
                              .then(CommandManager.argument("r", com.mojang.brigadier.arguments.DoubleArgumentType.doubleArg(1.0, 30.0))
                              .executes(context -> {
                                  ServerPlayerEntity player = context.getSource().getPlayer();
                                  if (player != null) {
                                      double r = com.mojang.brigadier.arguments.DoubleArgumentType.getDouble(context, "r");
                                      InfinityHandler.RADIUS_MAP.put(player.getUuid(), r);
                                      player.sendMessage(Text.literal("§b[Vô Hạ Hạn] §eBán kính: " + r), false);
                                  }
                                  return 1;
                              })))
                      );

                      // Lệnh Domain
                      dispatcher.register(CommandManager.literal("domain")
                          .then(CommandManager.literal("toggle").executes(context -> {
                              ServerPlayerEntity player = context.getSource().getPlayer();
                              if (player != null) DomainHandler.castDomain(player);
                              return 1;
                          }))
                      );
                  });
              }
          }
          EOF

          # 6. Client Class (Bắt phím tắt V và B)
          cat << 'EOF' > src/main/java/com/example/AnimeOverlordClient.java
          package com.example;

          import net.fabricmc.api.ClientModInitializer;
          import net.fabricmc.fabric.api.client.keybinding.v1.KeyBindingHelper;
          import net.fabricmc.fabric.api.client.event.lifecycle.v1.ClientTickEvents;
          import net.minecraft.client.option.KeyBinding;
          import net.minecraft.client.util.InputUtil;
          import org.lwjgl.glfw.GLFW;

          public class AnimeOverlordClient implements ClientModInitializer {
              public static KeyBinding infinityKey;
              public static KeyBinding domainKey;

              @Override
              public void onInitializeClient() {
                  infinityKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.animeoverlord.infinity",
                      InputUtil.Type.KEYSYM,
                      GLFW.GLFW_KEY_V, // Mặc định V
                      "category.animeoverlord.keys"
                  ));

                  domainKey = KeyBindingHelper.registerKeyBinding(new KeyBinding(
                      "key.animeoverlord.domain",
                      InputUtil.Type.KEYSYM,
                      GLFW.GLFW_KEY_B, // Mặc định B
                      "category.animeoverlord.keys"
                  ));

                  ClientTickEvents.END_CLIENT_TICK.register(client -> {
                      while (infinityKey.wasPressed()) {
                          if (client.player != null && client.player.networkHandler != null) {
                              client.player.networkHandler.sendChatCommand("infinity toggle");
                          }
                      }
                      while (domainKey.wasPressed()) {
                          if (client.player != null && client.player.networkHandler != null) {
                              client.player.networkHandler.sendChatCommand("domain toggle");
                          }
                      }
                  });
              }
          }
          EOF

      - name: Build Mod
        run: |
          chmod +x gradlew
          ./gradlew build --no-daemon

      - name: Upload Mod
        uses: actions/upload-artifact@v4
        with:
          name: Gojo-Sukuna-Mod
          path: build/libs/*.jar
